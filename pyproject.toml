[project]
name = "campus-ops-next"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4", "pydantic>=2.11,<3",
  "argon2-cffi>=25.1,<26", "cryptography>=45,<51",
  "temporalio>=1.9,<2", "nornir>=3.5,<4", "scrapli>=2025.1",
  "PyYAML>=6,<7"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
